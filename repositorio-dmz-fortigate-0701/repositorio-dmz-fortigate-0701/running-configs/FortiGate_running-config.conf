# ============================================================
#  FortiGate-VM64-KVM v7.0.9  |  Configuración aplicada por GUI
#  Equivalente en CLI de los objetos, interfaces y políticas
# ============================================================

config system settings
    set gui-multiple-interface-policy enable
end

# ---------------- Interfaces ----------------
config system interface
    edit "port1"
        set mode dhcp
        set allowaccess ping
        set role wan
    next
    edit "port2"
        set mode static
        set ip 0.0.0.0 0.0.0.0
        set role lan
    next
    edit "VLAN10"
        set vdom "root"
        set ip 10.7.1.129 255.255.255.128
        set role lan
        set interface "port2"
        set vlanid 10
    next
    edit "VLAN20"
        set vdom "root"
        set ip 10.7.7.1 255.255.255.128
        set role lan
        set interface "port2"
        set vlanid 20
    next
    edit "port3"
        set mode static
        set ip 10.7.1.1 255.255.255.240
        set allowaccess ping
        set role dmz
    next
    edit "port4"
        set mode static
        set ip 10.7.71.1 255.255.255.248
        set allowaccess ping https ssh http
        set role lan
    next
end

# ---------------- DHCP ----------------
config system dhcp server
    edit 0
        set interface "VLAN10"
        set default-gateway 10.7.1.129
        set netmask 255.255.255.128
        config ip-range
            edit 1
                set start-ip 10.7.1.171
                set end-ip 10.7.1.177
            next
        end
    next
    edit 0
        set interface "VLAN20"
        set default-gateway 10.7.7.1
        set netmask 255.255.255.128
        config ip-range
            edit 1
                set start-ip 10.7.7.71
                set end-ip 10.7.7.77
            next
        end
    next
end

# ---------------- DNS para la DMZ ----------------
config system dns-server
    edit "port3"
        set mode recursive
    next
end

# ---------------- Objetos de direcciones ----------------
config firewall address
    edit "NET-DMZ"
        set subnet 10.7.1.0 255.255.255.240
        set associated-interface "port3"
    next
    edit "NET-VLAN10"
        set subnet 10.7.1.128 255.255.255.128
        set associated-interface "VLAN10"
    next
    edit "NET-VLAN20"
        set subnet 10.7.7.0 255.255.255.128
        set associated-interface "VLAN20"
    next
    edit "SRV-CAJA"
        set subnet 10.7.1.3 255.255.255.255
        set associated-interface "port3"
    next
    edit "SRV-DB"
        set subnet 10.7.1.4 255.255.255.255
        set associated-interface "port3"
    next
    edit "SRV-INV"
        set subnet 10.7.1.5 255.255.255.255
        set associated-interface "port3"
    next
    edit "UPD-ubuntu-archive"
        set type fqdn
        set fqdn "archive.ubuntu.com"
    next
    edit "UPD-ubuntu-security"
        set type fqdn
        set fqdn "security.ubuntu.com"
    next
    edit "UPD-ubuntu-ports"
        set type fqdn
        set fqdn "ports.ubuntu.com"
    next
    edit "UPD-mysql-repo"
        set type fqdn
        set fqdn "repo.mysql.com"
    next
end

config firewall addrgrp
    edit "GRP-UPDATES"
        set member "UPD-ubuntu-archive" "UPD-ubuntu-security" "UPD-ubuntu-ports" "UPD-mysql-repo"
    next
end

# ---------------- Web Filter ----------------
config webfilter urlfilter
    edit 1
        set name "WF-BLOQUEO-INV"
        config entries
            edit 1
                set url "10.7.1.5"
                set type simple
                set action block
                set status enable
            next
        end
    next
    edit 2
        set name "WF-DMZ-UPDATES"
        config entries
            edit 1
                set url "archive.ubuntu.com"
                set type simple
                set action allow
                set status enable
            next
            edit 2
                set url "security.ubuntu.com"
                set type simple
                set action allow
                set status enable
            next
            edit 3
                set url "ports.ubuntu.com"
                set type simple
                set action allow
                set status enable
            next
            edit 4
                set url "repo.mysql.com"
                set type simple
                set action allow
                set status enable
            next
            edit 5
                set url "*"
                set type wildcard
                set action block
                set status enable
            next
        end
    next
end

config webfilter profile
    edit "WF-BLOQUEO-INV"
        set feature-set flow
        config web
            set urlfilter-table 1
        end
    next
    edit "WF-DMZ-UPDATES"
        set feature-set flow
        config web
            set urlfilter-table 2
        end
    next
end

# ---------------- Políticas de firewall (en orden) ----------------
config firewall policy
    edit 0
        set name "LAN20-SSH-DMZ"
        set srcintf "VLAN20"
        set dstintf "port3"
        set action accept
        set srcaddr "NET-VLAN20"
        set dstaddr "NET-DMZ"
        set schedule "always"
        set service "SSH" "HTTP" "HTTPS"
        set logtraffic all
        set ssl-ssh-profile "no-inspection"
    next
    edit 0
        set name "LAN10-WEB-CAJA"
        set srcintf "VLAN10"
        set dstintf "port3"
        set action accept
        set srcaddr "NET-VLAN10"
        set dstaddr "SRV-CAJA"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set logtraffic all
        set ssl-ssh-profile "no-inspection"
    next
    edit 0
        set name "LAN10-INV-BLOQUEADO"
        set srcintf "VLAN10"
        set dstintf "port3"
        set action accept
        set srcaddr "NET-VLAN10"
        set dstaddr "SRV-INV"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "WF-BLOQUEO-INV"
        set logtraffic all
    next
    edit 0
        set name "LAN10-DENY-DMZ"
        set srcintf "VLAN10"
        set dstintf "port3"
        set action deny
        set srcaddr "NET-VLAN10"
        set dstaddr "NET-DMZ"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 9
        set name "DMZ-UPDATES-WAN"
        set srcintf "port3"
        set dstintf "port1"
        set action accept
        set srcaddr "NET-DMZ"
        set dstaddr "GRP-UPDATES"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "WF-DMZ-UPDATES"
        set logtraffic all
        set nat enable
    next
    edit 11
        set name "LAN-WAN-VLAN 10"
        set srcintf "VLAN10"
        set dstintf "port1"
        set action accept
        set srcaddr "NET-VLAN10"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set ssl-ssh-profile "no-inspection"
        set nat enable
    next
    edit 0
        set name "DMZ-DENY-ALL"
        set srcintf "port3"
        set dstintf "any"
        set action deny
        set srcaddr "NET-DMZ"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 10
        set name "LAN-WAN-VLAN20"
        set srcintf "VLAN20"
        set dstintf "port1"
        set action accept
        set srcaddr "NET-VLAN20"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set ssl-ssh-profile "no-inspection"
        set nat enable
    next
end
